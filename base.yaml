# DevGPT base configuration: stable parameters (rarely changed).
# config.yaml inherits this file and overrides run-specific settings (paths, switches).

npme:
  # --- data ---
  input_shape: [128, 128, 128]
  num_classes_seg: 3
  voxel_size: 0.36
  surface_level: 0.5
  boundary_step_size: 0.25
  # --- model ---
  geometry_dim: 20
  latent_channels: 32
  latent_spatial_shape: [4, 4, 4]
  cnn_base_channels: 32
  geometry_conditioner_hidden_dims: [128, 512]
  geometry_conditioner_channels: 64
  geometry_conditioner_dropout: 0.05
  geometry_readout_output_dims: [1, 1, 1, 1, 1, 1, 1, 1, 3, 3, 1, 1, 1, 1, 1, 1]
  geometry_readout_dropout: 0.05
  # --- training ---
  batch_size_per_gpu: 8
  train_num_workers: 24
  eval_num_workers: 16
  inference_num_workers: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  eval_num_samples: 1000
  max_iters: 20000
  log_interval: 50
  eval_interval: 2000
  grad_loss_start_iter: 1000
  onecycle_pct_start: 0.05
  lr_max: 0.0002
  geo_loss_weight: 0.002

data:
  label_delimiter: _
  label_index: -1
  max_seq_len: 255
  input_dim: 2048
  normalization_eps: 1.0e-06

model:
  d_model: 192
  dropout: 0.25
  ffn_dim: 768
  max_len_extra: 10
  num_heads: 6
  num_layers: 4

pretrain:
  epochs: 300
  batch_size: 32
  num_workers: 4
  pin_memory: true
  drop_last: false
  lr: 0.0003
  weight_decay: 0.05
  warmup_epochs: 10
  val_size: 0.1
  patience: 30
  ntp_loss_type: mse
  grad_clip_norm: 1.0

finetune4cellfate:
  min_samples_per_class: 5
  test_size: 0
  val_size: 0.15
  epochs: 200
  batch_size: 32
  num_workers: 4
  pin_memory: true
  drop_last: false
  weight_decay: 0.1
  warmup_epochs: 5
  patience: 100
  label_smoothing: 0.05
  backbone_lr: 3.0e-05
  head_lr: 0.0003
  freeze_epochs: 5
  aux_ntp_weight: 0.05
  ntp_loss_type: mse
  grad_clip_norm: 1.0

inference4cellfate:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  drop_last: false
  max_seq_len: null
  top_k: 3

finetune4cellcycle:
  test_size: 0
  val_size: 0.15
  min_obs_steps: 5
  min_obs_ratio: 0.1
  max_obs_ratio: 0.9
  eval_min_obs_ratio: 0.0
  eval_max_obs_ratio: 0.4
  epochs: 200
  batch_size: 32
  num_workers: 4
  pin_memory: true
  drop_last: false
  weight_decay: 0.1
  warmup_epochs: 5
  patience: 100
  regression_loss: huber
  huber_delta: 1.0
  use_log_target: true
  tolerances:
  - 5
  - 10
  backbone_lr: 3.0e-05
  head_lr: 0.0003
  freeze_epochs: 5
  aux_ntp_weight: 0.05
  ntp_loss_type: mse
  grad_clip_norm: 1.0

inference4cellcycle:
  input_ratio_min: 0.0
  input_ratio_max: 0.4
  batch_size: 32
  num_workers: 4
  pin_memory: true
  drop_last: false
  max_seq_len: null

logging:
  level: INFO
  format: '%(asctime)s.%(msecs)03d | %(levelname)s | %(message)s'
  datefmt: '%Y-%m-%d %H:%M:%S'

project:
  seed: 42
  deterministic: false
  device: auto
